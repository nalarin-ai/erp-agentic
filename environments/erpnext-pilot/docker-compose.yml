services:
  mariadb:
    image: mariadb:11.8
    container_name: erpnext-pilot-db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - erpnext-pilot
    restart: "no"

  redis-cache:
    image: redis:7-alpine
    container_name: erpnext-pilot-redis-cache
    networks:
      - erpnext-pilot
    restart: "no"

  redis-queue:
    image: redis:7-alpine
    container_name: erpnext-pilot-redis-queue
    networks:
      - erpnext-pilot
    restart: "no"

  create-site:
    image: frappe/erpnext:v16.32.1
    container_name: erpnext-pilot-create-site
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it mariadb:3306 &&
        wait-for-it redis-cache:6379 &&
        wait-for-it redis-queue:6379 &&
        export PATH=$${PATH}:$${HOME}/.local/bin &&
        bench new-site $${SITE_NAME}
        --no-mariadb-socket
        --db-host mariadb
        --db-port 3306
        --db-root-username root
        --db-root-password $${DB_ROOT_PASSWORD}
        --admin-password $${ADMIN_PASSWORD}
        --install-app erpnext
        --force &&
        echo "SITE_CREATED_OK"
    environment:
      SITE_NAME: ${SITE_NAME}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - erpnext-pilot
    restart: "no"

  backend:
    image: frappe/erpnext:v16.32.1
    container_name: erpnext-pilot-backend
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue
    command: ["bench", "--site", "all", "serve", "--port", "8000"]
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - erpnext-pilot
    ports:
      - "127.0.0.1:18080:8000"
    restart: "no"

volumes:
  db-data:
  sites:

networks:
  erpnext-pilot:
    driver: bridge
